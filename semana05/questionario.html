<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/questionario.css">
    <title>Questionário de HTML e CSS</title>
</head>

<body>

    <header>
        <h1>Questionário de HTML e CSS</h1>
    </header>

    <main>
        <form>
            <div>
                <label for="q1">1. O que significa a sigla CSS?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div>
                <label for="q2">2. Como os atributos id e class são selecionados no CSS?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <div>
                <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="opcao1">&lt;!-- comentário --&gt;</option>
                    <option value="opcao2">/* comentário */</option>
                    <option value="opcao3">// comentário</option>
                </select>
            </div>

            <div>
                <label for="q4">4. Qual é a margem inferior dada por esta declaração: margin: 10px 5px 15px?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Enviar Questionário</button>
        </form>
    </main>

    <footer>
        <p>©️ 2026 | Questionário de HTML e CSS | Fabio Rocha</p>
    </footer>

</body>
</html>
