<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | Companhia de Rafting</title>
    <meta name="description" content="Entre em contato com nossa companhia de rafting para dúvidas, reservas e sugestões.">

    <link rel="stylesheet" href="styles/rafting.css">
</head>
<main>
    <section class="contact-info">
        <h1>Companhia de Rafting em Corredeiras</h1>

        <p>123 Rua Principal do Rio</p>
        <p>Foz do Iguaçu, Paraná</p>
        <p>+55 45 99999-9999</p>
        <p>info@correiras.com</p>
    </section>

    <section class="contact">
        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d18373.159155444875!2d-46.40464549080478!3d-23.971167557800776!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1790877769287!5m2!1spt-BR!2sbr"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">title="Localização da Companhia de
                Rafting">
            </iframe>
        </div>

        <form>
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" placeholder="Digite aqui" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite aqui" required>

            <p>Propósito da Mensagem</p>

            <label>
                <input type="radio" name="purpose" value="general">
                Consulta Geral
            </label>

            <label>
                <input type="radio" name="purpose" value="reservation">
                Pergunta sobre Reserva
            </label>

            <label>
                <input type="radio" name="purpose" value="suggestion">
                Sugestão de Site
            </label>

            <label for="message">Mensagem</label>
            <textarea id="message" name="message" placeholder="Digite aqui">
            </textarea>

            <label>
                <input type="checkbox" name="newsletter">
                Quero receber a newsletter mensal
            </label>

            <button type="submit">Entrar em Contato!</button>
        </form>
    </section>

    <section class="employees">
        <h2>Estamos Aqui para Servi-lo</h2>

        <div class="employee">
            <img src="images/funcionario1.jpg" alt="Funcionário da companhia de rafting">
            <p>Nome do Funcionário</p>
            <p>Cargo</p>
        </div>

        <div class="employee">
            <img src="images/funcionario2.jpg" alt="Funcionário da companhia de rafting">
            <p>Nome do Funcionário</p>
            <p>Cargo</p>
        </div>

        <div class="employee">
            <img src="images/funcionario3.jpg" alt="Funcionário da companhia de rafting">
            <p>Nome do Funcionário</p>
            <p>Cargo</p>
        </div>
    </section>
</main>
